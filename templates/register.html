{% extends "base.html" %}

{% block title %}Sign up — BentoProxy{% endblock %}

{% block content %}
<section class="container auth stack">
    <div class="center stack-sm">
        <h1>Create an account</h1>
        <p class="muted">Already have one? <a href="/login">Log in</a>.</p>
    </div>

    {% if !error.is_empty() %}
    <p class="notice notice-error">{{ error }}</p>
    {% endif %}

    <div class="card">
        <form class="card-body stack" action="/register" method="POST">
            <div class="field">
                <label class="label" for="email">Email</label>
                <input class="input" id="email" name="email" type="email"
                       autocomplete="email" required>
            </div>
            <div class="field">
                <label class="label" for="password">Password</label>
                <input class="input" id="password" name="password" type="password"
                       autocomplete="new-password" minlength="8" required>
                <p class="hint">At least 8 characters.</p>
            </div>

            <fieldset>
                <legend class="label">I want to</legend>
                <div class="stack-sm">
                    <label class="option">
                        <input type="radio" name="role" value="device_owner" required>
                        <span>
                            <strong>Run nodes</strong>
                            <span class="small muted">Share a home connection from hardware you own</span>
                        </span>
                    </label>
                    <label class="option">
                        <input type="radio" name="role" value="proxy_user" required>
                        <span>
                            <strong>Use the proxy</strong>
                            <span class="small muted">Route traffic through residential nodes</span>
                        </span>
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>
    </div>
</section>
{% endblock %}
