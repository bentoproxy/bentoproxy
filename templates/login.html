{% extends "base.html" %}

{% block title %}Log in — BentoProxy{% endblock %}

{% block content %}
<section class="container auth stack">
    <div class="center stack-sm">
        <h1>Log in</h1>
        <p class="muted">Or <a href="/register">create an account</a>.</p>
    </div>

    {% if !error.is_empty() %}
    <p class="notice notice-error">{{ error }}</p>
    {% endif %}

    <div class="card">
        <form class="card-body stack" action="/login" method="POST">
            <div class="field">
                <label class="label" for="email">Email</label>
                <input class="input" id="email" name="email" type="email"
                       autocomplete="email" required>
            </div>
            <div class="field">
                <label class="label" for="password">Password</label>
                <input class="input" id="password" name="password" type="password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>
    </div>
</section>
{% endblock %}
